<!DOCTYPE html><html lang="en"><head><script>(function(){try{var t=localStorage.getItem("stacs_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STACS · Sign in</title>
<style>
:root{--bg:#062514;--card:#0D3D1E;--card2:#0F4423;--bdr:rgba(255,255,255,.14);--gold:#C8920A;--gold2:#E2A53A;--grn:#2ECC71;--rd:#E86A6A;--tx:#F0F0EC;--tx2:rgba(240,240,236,.66);--tx3:rgba(240,240,236,.4)}
*{box-sizing:border-box;margin:0;padding:0}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:#0B3B21;color:#fff;backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:11px;padding:0 22px;z-index:30}
.topbar .brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff!important}
.topbar .brandlink img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:cover;border:1.5px solid var(--gold)}
.topbar .brandlink b{font-size:14px;font-weight:800;color:#fff!important}.topbar .brandlink small{display:block;font-size:8.5px;letter-spacing:.22em;color:var(--gold2)}
.topnav{margin-left:auto;display:flex;gap:18px}.topnav a{color:rgba(255,255,255,.86)!important;font-size:13px;text-decoration:none}.topnav a:hover{color:var(--gold2)}
@media(max-width:520px){.topnav a.hideS{display:none}}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 80% -10%,rgba(200,146,10,.22),transparent 60%),var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:88px 20px 48px}
.box{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:26px}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid var(--gold)}
.brand b{font-size:17px;font-weight:800}.brand small{display:block;font-size:9px;letter-spacing:.22em;color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:28px}
h1{font-size:21px;margin-bottom:5px}.sub{font-size:13px;color:var(--tx2);margin-bottom:20px}
.hubsec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:0 0 8px}
.hubgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.hub{background:var(--card2);border:1px solid var(--bdr);border-radius:10px;padding:9px 6px;cursor:pointer;text-align:center;transition:.14s;font-family:inherit}
.hub .ic{font-size:16px;display:block;margin-bottom:3px}
.hub .nm{font-size:11px;font-weight:700;color:var(--tx);line-height:1.25;display:block}
.hub .id{font-size:8.5px;color:var(--tx3);font-family:ui-monospace,monospace;display:block;margin-top:2px}
.hub:hover{border-color:var(--gold2)}
.hub.on{background:var(--gold);border-color:var(--gold)}
.hub.on .nm,.hub.on .id{color:#231a02}
.hub.soon{opacity:.5;cursor:not-allowed}
.hub.soon:hover{border-color:var(--bdr)}
.soonnote{font-size:11px;color:var(--tx3);margin:-6px 0 14px;text-align:center}
label{font-size:12px;color:var(--tx);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px}
input{width:100%;background:var(--card2);border:1px solid var(--bdr);border-radius:9px;padding:11px 13px;color:var(--tx);font-size:14px;margin-bottom:14px;font-family:inherit}
input:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#231a02;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:14.5px;cursor:pointer}
.btn:hover{background:var(--gold2)}
.msg{font-size:12.5px;border-radius:9px;padding:10px 12px;margin-top:13px;display:none}
.msg.err{background:rgba(232,106,106,.12);color:var(--rd);display:block}.msg.ok{background:rgba(46,204,113,.12);color:var(--grn);display:block}
.foot{text-align:center;font-size:12.5px;color:var(--tx3);margin-top:18px}.foot a{color:var(--gold2);text-decoration:none}
:root[data-theme="light"]{--bg:#F3F1EA;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F5F4EE;--s1:#FFFFFF;--s2:#F5F4EE;--bdr:rgba(15,59,46,.14);--bdr2:rgba(15,59,46,.26);--tx:#1E241C;--tx2:#4f574a;--tx3:#6c7466;--gp:rgba(200,146,10,.13);--grnp:rgba(46,204,113,.14);--gold:#8A6508;--gold2:#7A5A07;--grn:#1B7A43;--rd:#B3352F}.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px!important}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gold2);font-size:11.5px;font-weight:700;cursor:pointer;padding:4px 6px;text-transform:uppercase;letter-spacing:.4px}
</style></head><body>
<div class="topbar"><a class="brandlink" href="index.html"><img src="https://stacs.leivotest.com/images/logo.jpg" onerror="this.style.display='none'" alt="STACS"><span><b>LEIVOTEST — STACS</b><small>WORKFORCE MOBILITY</small></span></a><div class="topnav"><a href="index.html">Home</a><a class="hideS" href="https://leivotest.com/skilled-tradepersons-talent-pool/" target="_blank" rel="noopener">Our Story</a><a href="faq.html">Help</a><a href="join.html">Join free</a></div></div>
<div class="box">
 <a href="index.html" style="text-decoration:none;color:inherit" class="brand"><img class="logo" src="https://stacs.leivotest.com/images/logo.jpg" onerror="this.style.display='none'" alt="STACS"><div><b>STACS</b><small>LEIVOTEST</small></div></a>
 <div class="card">
  <h1>Sign in</h1><div class="sub">Access your STACS account.</div>
  <div class="hubsec">Open now — choose your hub</div>
  <div class="hubgrid">
   <button type="button" class="hub on" id="hub_worker"   onclick="setRole('worker')"><span class="ic">&#128296;</span><span class="nm">Skilled Worker</span><span class="id">WK-</span></button>
   <button type="button" class="hub"    id="hub_employer" onclick="setRole('employer')"><span class="ic">&#127970;</span><span class="nm">Employer</span><span class="id">EM-</span></button>
   <button type="button" class="hub"    id="hub_verifier" onclick="setRole('verifier')"><span class="ic">&#128269;</span><span class="nm">Verifier</span><span class="id">VF-</span></button>
   <button type="button" class="hub"    id="hub_translator" onclick="setRole('translator')"><span class="ic">&#127760;</span><span class="nm">Translator</span><span class="id">TR-</span></button>
   <button type="button" class="hub"    id="hub_travel" onclick="setRole('travel')"><span class="ic">&#9992;</span><span class="nm">Travel Agency</span><span class="id">TA-</span></button>
  </div>
  <div class="hubsec">Opening soon</div>
  <div class="hubgrid">
   <button type="button" class="hub soon" onclick="soonMsg('Recruitment Agency')"><span class="ic">&#129309;</span><span class="nm">Agency</span><span class="id">AG-</span></button>
   <button type="button" class="hub soon" onclick="soonMsg('Immigration Lawyer')"><span class="ic">&#9878;</span><span class="nm">Lawyer</span><span class="id">LW-</span></button>
   <button type="button" class="hub soon" onclick="soonMsg('Training Provider')"><span class="ic">&#127891;</span><span class="nm">Training</span><span class="id">TP-</span></button>
   <button type="button" class="hub soon" onclick="soonMsg('Settlement Partner')"><span class="ic">&#127968;</span><span class="nm">Settlement</span><span class="id">SP-</span></button>
  </div>
  <div class="soonnote" id="soonNote">These hubs are being activated one by one.</div>
  <label>Email</label><input id="email" type="email" placeholder="you@email.com">
  <label>Password</label><input id="pw" type="password" placeholder="Your password">
  <button class="btn" id="btn" onclick="signIn()">Sign in</button>
  <div style="text-align:right;margin-top:10px"><button type="button" onclick="forgot()" style="background:none;border:none;color:var(--gold2);font-size:12.5px;cursor:pointer;padding:0">Forgot your password?</button></div>
  <div class="msg" id="msg"></div>
 </div>
 <div class="foot">New to STACS? <a href="join.html">Join free — choose your hub</a> · <a href="faq.html">Help &amp; FAQ</a></div>
</div>
<script>
const SKILLED_URL="https://script.google.com/macros/s/AKfycbwtUYMty_LLT2MohBVwnMoCNRsm-r2b1A4rJRcU6q9B8x-1eOHJgzctiagmKrybo5alqg/exec";
const EMPLOYER_URL="https://script.google.com/macros/s/AKfycbwPlLG5bdp5MsTFUU6RYLdz6g5zWJLRkmjmkkenqqWBz4Xy9PoSIZVRDA4iZSRBHRBq/exec";
const TRANSLATOR_URL="https://script.google.com/macros/s/AKfycbYBRY75JwvvyHGjtlgkzKGn47HTSA3fyqfWrF5DbQ3swjFIMDzAMfQ8jMWsu0lf3g4/exec";
const VERIFIER_URL="https://script.google.com/macros/s/AKfycbzyh4HEurpOl9T_Ap5HXpGZlro0jCz3xBet7yQMFZcVwUFa7bQD5PtzkWJe4iABUkgf/exec";
/* ===== PASTE the deployed Travel Agency web-app /exec URL here ===== */
const TRAVEL_URL="https://script.google.com/macros/s/AKfycbzv4v5pktq9j3fIzwaB5zCpySYJO9DjfMzV78lftWjZoFoKMVIpN1_zRb3OVzdOv5FQjg/exec";
let ROLE='worker';
function setRole(r){
 ROLE=r;
 ['worker','employer','verifier','translator','travel'].forEach(function(k){
   var el=document.getElementById('hub_'+k); if(el) el.classList.toggle('on', k===r);
 });
 var n=document.getElementById('soonNote');
 if(n){
   if(r==='travel') n.innerHTML='New Travel Agency? <a href="STACS_Travel_Agency_Registration_Form.html" style="color:var(--gold2)">Register your agency here</a>.';
   else n.textContent='These hubs are being activated one by one.';
 }
}
function soonMsg(name){
 var n=document.getElementById('soonNote');
 if(n) n.innerHTML='<b style="color:var(--gold2)">'+name+'</b> is not open yet. We are activating hubs one by one \u2014 <a href="join.html" style="color:var(--gold2)">register your interest</a>.';
}
async function sha256(s){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function signIn(){
 const msg=document.getElementById('msg');msg.className='msg';msg.textContent='';
 const email=document.getElementById('email').value.trim(),pw=document.getElementById('pw').value;
 if(!email||!pw){msg.className='msg err';msg.textContent='Enter your email and password.';return;}
 const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Signing in…';
 const h=await sha256(pw);const base=(ROLE==='employer'?EMPLOYER_URL:ROLE==='verifier'?VERIFIER_URL:ROLE==='translator'?TRANSLATOR_URL:ROLE==='travel'?TRAVEL_URL:SKILLED_URL);
 if(ROLE==='travel' && base.indexOf('PASTE')===0){ msg.className='msg err'; msg.textContent='The Travel Agency hub is being connected. Please try again shortly.'; var b0=document.getElementById('btn'); b0.disabled=false; b0.textContent='Sign in'; return; }
 const url=base+'?action=login&email='+encodeURIComponent(email)+'&h='+h;
 try{
   const r=await fetch(url);const d=await r.json();
   if(d&&d.ok){
     localStorage.setItem('stacs_session',JSON.stringify({role:ROLE,em:d.id,wk:d.id,id:d.id,name:d.name,company:d.company||'',tier:d.tier||'',photo:d.photo||'',stage:d.stage||'',token:d.token||'',status:d.status||'',email:email}));
     location.href=ROLE==='employer'?'employer-dashboard.html':ROLE==='verifier'?'verifier-dashboard.html':ROLE==='translator'?'translator-dashboard.html':ROLE==='travel'?'travel-agency-dashboard.html':'candidate-dashboard.html';
   } else { msg.className='msg err';var e=(d&&d.error)||'';
       msg.textContent = (e==='No account'||e.indexOf('No account')===0)
         ? 'We could not find an account with that email in the '+(ROLE==='worker'?'Skilled Worker':ROLE==='employer'?'Employer':ROLE==='verifier'?'Verifier':ROLE==='travel'?'Travel Agency':'Translator')+' hub. Check you have selected the right hub above, or register first.'
         : (e||'Incorrect email or password, or your account is not yet approved.');btn.disabled=false;btn.textContent='Sign in'; }
 }catch(e){ msg.className='msg err';msg.textContent='Could not reach the server. Check the login endpoint is deployed.';btn.disabled=false;btn.textContent='Sign in'; }
}
async function forgot(){
 const msg=document.getElementById('msg'); msg.className='msg';
 const email=document.getElementById('email').value.trim();
 if(!email){ msg.className='msg err'; msg.textContent='Enter your email address above first, then tap "Forgot your password?".'; return; }
 const base=(ROLE==='employer'?EMPLOYER_URL:ROLE==='verifier'?VERIFIER_URL:ROLE==='translator'?TRANSLATOR_URL:ROLE==='travel'?TRAVEL_URL:SKILLED_URL);
 msg.className='msg'; msg.style.display='block'; msg.style.background='rgba(200,146,10,.12)'; msg.style.color='#E2A53A';
 msg.textContent='Sending your reset link…';
 try{
   const r=await fetch(base+'?action=forgot&email='+encodeURIComponent(email));
   const d=await r.json();
   msg.className='msg ok';
   msg.textContent=(d&&d.message)||'If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.';
 }catch(e){
   msg.className='msg err'; msg.textContent='Could not reach the server. Please try again shortly.';
 }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});
</script>
<script>function stacsTheme(){var d=document.documentElement,t=d.getAttribute("data-theme")==="light"?"dark":"light";d.setAttribute("data-theme",t);try{localStorage.setItem("stacs_theme",t);}catch(e){}var b=document.getElementById("themeBtn");if(b)b.innerHTML=t==="light"?"&#9728;&#65039;":"&#127769;";}
(function(){try{var t=localStorage.getItem("stacs_theme")||"dark";var b=document.getElementById("themeBtn");if(b)b.innerHTML=t==="light"?"&#9728;&#65039;":"&#127769;";}catch(e){}})();</script>
<script>
(function(){
  function attach(){
    var ins=document.querySelectorAll('input[type=password]');
    for(var i=0;i<ins.length;i++){
      (function(inp){
        if(inp.getAttribute('data-eye'))return;
        inp.setAttribute('data-eye','1');
        var w=document.createElement('div'); w.className='pw-wrap';
        inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
        var b=document.createElement('button');
        b.type='button'; b.className='pw-eye'; b.textContent='Show';
        b.setAttribute('aria-label','Show or hide password');
        b.onclick=function(){ var sh=inp.type==='password'; inp.type=sh?'text':'password'; b.textContent=sh?'Hide':'Show'; };
        w.appendChild(b);
      })(ins[i]);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',attach); else attach();
})();
</script>
</body></html>
