<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STACS · Email verified</title>
<style>
:root{--bg:#0A2E16;--bg2:#0D3D1E;--card:#12502A;--card2:#0F4423;--bdr:rgba(255,255,255,.13);--bdr2:rgba(255,255,255,.24);--gold:#C8920A;--gold2:#E2A53A;--grn:#2ECC71;--tx:#F0F0EC;--tx2:rgba(240,240,236,.7);--tx3:rgba(240,240,236,.45)}
:root[data-theme="light"]{--bg:#F3F1EA;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F5F4EE;--bdr:rgba(15,59,46,.14);--bdr2:rgba(15,59,46,.26);--tx:#1E241C;--tx2:#4f574a;--tx3:#6c7466;--gold:#8A6508;--gold2:#7A5A07;--grn:#1B7A43}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 80% -10%,rgba(200,146,10,.2),transparent 60%),var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:70px 20px 50px;line-height:1.6}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:#0B3B21;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:11px;padding:0 22px;z-index:30}
.topbar a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff!important}
.topbar img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:cover;border:1.5px solid var(--gold)}
.topbar b{font-size:14px;font-weight:800;color:#fff!important}
.topbar small{display:block;font-size:8.5px;letter-spacing:.22em;color:var(--gold2)}
.box{width:100%;max-width:520px;text-align:center}
.tick{width:78px;height:78px;border-radius:50%;background:rgba(46,204,113,.14);border:2px solid var(--grn);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--grn);margin:0 auto 20px}
h1{font-size:26px;margin-bottom:8px}
.lede{font-size:15px;color:var(--tx2);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:24px;text-align:left}
.steps{margin:4px 0 20px}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bdr)}
.step:last-child{border-bottom:none}
.step .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step.done .n{background:var(--grn);color:#04260f}
.step.now .n{background:var(--gold);color:#231a02}
.step.next .n{background:var(--card2);color:var(--tx3);border:1px solid var(--bdr)}
.step .t{font-size:14.5px;font-weight:700}
.step .d{font-size:12.8px;color:var(--tx2)}
.cta{display:block;background:var(--gold);color:#231a02;border-radius:11px;padding:15px;font-weight:800;font-size:15px;text-decoration:none;text-align:center;margin-top:6px}
.cta:hover{background:var(--gold2)}
.help{font-size:12.8px;color:var(--tx3);margin-top:18px}
.help a{color:var(--gold2);text-decoration:none}
</style></head><body>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  var hub=(q.get('hub')||'worker').toLowerCase();
  var id=q.get('id')||'';
  var approved=q.get('approved')==='1';

  var LABEL={worker:'Skilled Worker Pool',employer:'Employer Hub',verifier:'Assessor & Verifier Hub',translator:'Translator Hub'}[hub]||'STACS';
  var needsApproval=(hub==='verifier'||hub==='translator');

  if(approved && id){
    document.getElementById('headline').textContent='Your account is ready';
    document.getElementById('lede').innerHTML='Your email is verified and your STACS ID is <b>'+id+'</b>. You can sign in now.';
  } else if(needsApproval){
    document.getElementById('headline').textContent='Your email is verified';
    document.getElementById('lede').textContent='Our team now reviews your accreditation. We will email you as soon as it is confirmed.';
  }

  var steps=[
    {t:'Account created', d:'Your free STACS account is registered.', s:'done'},
    {t:'Email verified', d:'Done — thank you for confirming.', s:'done'},
    needsApproval
      ? {t:'Accreditation review', d:'Our team confirms your credentials with the issuing body.', s:'now'}
      : {t:'Sign in', d:'Use the email and password you just registered with.', s:'now'},
    {t:'Complete your profile', d:'Add your details at your own pace — your progress is saved.', s:'next'},
    needsApproval
      ? {t:'Submit for approval', d:'Only when you are ready.', s:'next'}
      : {t:'Migrate into the Job Pool', d:'Become visible to employers.', s:'next'}
  ];
  document.getElementById('steps').innerHTML=steps.map(function(x,i){
    return '<div class="step '+x.s+'"><div class="n">'+(x.s==='done'?'&#10003;':(i+1))+'</div>'
      +'<div><div class="t">'+x.t+'</div><div class="d">'+x.d+'</div></div></div>';
  }).join('');
  if(needsApproval && !approved){
    document.getElementById('cta').textContent='Back to STACS';
    document.getElementById('cta').setAttribute('href','index.html');
  }
})();
</script>
